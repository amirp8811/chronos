[package]
name = "chronos-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
chronos-core = { path = "../crates/chronos-core" }
chronos-dir = { path = "../crates/chronos-dir" }
chronosd = { path = "../crates/chronosd" }
chronos-lite = { path = "../crates/chronos-lite" }
chronos-sys-dataplane = { path = "../crates/chronos-sys-dataplane" }
chronos-wasm = { path = "../crates/chronos-wasm" }

[[bin]]
name = "relay_packet"
