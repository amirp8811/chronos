# Illustrative future directory configuration.
# chronos-dir currently reads its local TCP bind and database path from
# environment variables; this file is documentation only, not a live service
# configuration.

[directory]
# CHRONOS_DIR_API_BIND = "127.0.0.1:7000"
# CHRONOS_DIR_DB = "./chronos-dir.db"

[security]
# Signed UPSERT_SIGNED records are required by default.
# Plaintext mutation and remote PRUNE are disabled unless explicit local
# development environment switches are set.
max_record_lifetime_seconds = 86400
