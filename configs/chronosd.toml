# Configuration for the experimental UDP relay service.
# This is not a production deployment profile.

[node]
node_name = "local-relay"
node_id_fp = "local-relay.chr"
operating_role = "relay"
jurisdiction = "local"

[security]
# Enabling PoW requires this environment variable to contain 64 hexadecimal
# characters (32 non-zero bytes). No secret belongs in this file.
enable_pow_client_puzzles = false
pow_secret_env = "CHRONOSD_POW_SECRET_HEX"
pow_window_seconds = 30
pow_default_difficulty_zero_bits = 8

[runtime]
key_dir = ".chronosd-keys"
# udp_relay_bind = "127.0.0.1:7000"
static_routes = ""
route_secrets = ""
route_replay_max_entries = 4096
route_replay_ttl_seconds = 300
outbound_queue_max = 1024
# Best-effort delay only; it does not provide constant-rate egress or cover traffic.
send_delay_ms = 0
# metrics_bind = "127.0.0.1:9100"
enforce_sessions = false
