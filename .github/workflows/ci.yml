name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - name: Install Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.x"

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Workspace tests
        run: cargo test --workspace

      - name: Locked dependency tests
        run: cargo test --workspace --locked

      - name: Run chronos-nettest scenarios
        run: |
          cargo run -p chronos-nettest -- --scenario three-hop-local --messages 10 --out reports/three-hop-local.json
          cargo run -p chronos-nettest -- --scenario replay-negative --out reports/replay-negative.json
          cargo run -p chronos-nettest -- --scenario directory-negative --out reports/directory-negative.json
          grep '"ok": true' reports/three-hop-local.json
          grep '"messages_sent": 10' reports/three-hop-local.json
          grep '"messages_delivered": 10' reports/three-hop-local.json
          grep '"ok": true' reports/replay-negative.json
          grep '"ok": true' reports/directory-negative.json

      - name: no_std core subset
        run: cargo check -p chronos-core --no-default-features

      - name: Simulation feature tests
        run: cargo test -p chronos-core --features simulation

      - name: Duplicate dependency report
        run: cargo tree -d

      - name: Static audit
        run: python3 scripts/static_audit.py

  fuzz-build:
    name: fuzz-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install nightly Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked

      - name: Build fuzz targets
        run: cargo +nightly fuzz build
