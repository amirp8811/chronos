[package]
name = "chronosd"
version = "7.0.0"
edition = "2024"
authors = ["Clean-Slate Anonymous Networking Working Group"]
description = "Experimental UDP relay daemon for CHRONOS protocol tests"

[dependencies]
chronos-core = { path = "../chronos-core" }
chronos-sys-dataplane = { path = "../chronos-sys-dataplane" }
tokio = { version = "1.37", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
log = "0.4"
getrandom = "0.2"
