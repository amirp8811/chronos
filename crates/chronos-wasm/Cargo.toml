[package]
name = "chronos-wasm"
version = "7.0.0"
edition = "2024"
authors = ["Clean-Slate Anonymous Networking Working Group"]
description = "Experimental WebAssembly bindings for CHRONOS protocol demonstrations"

[features]
default = []
# Retains unimplemented browser-behaviour models for local demonstrations only.
simulation = []

[dependencies]
chronos-core = { path = "../chronos-core" }
log = "0.4"
wasm-bindgen = "0.2"

[lib]
crate-type = ["cdylib", "rlib"]
