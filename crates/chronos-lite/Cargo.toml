[package]
name = "chronos-lite"
version = "7.0.0"
edition = "2024"
authors = ["Clean-Slate Anonymous Networking Working Group"]
description = "Parse-only lite configuration and local prototype tests for CHRONOS"

[dependencies]
chronos-core = { path = "../chronos-core" }
tokio = { version = "1.37", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
log = "0.4"
