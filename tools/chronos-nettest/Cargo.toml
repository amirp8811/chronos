[package]
name = "chronos-nettest"
version = "0.1.0"
edition = "2024"
description = "Local CHRONOS relay experiment harness and smoke scenarios"
publish = false

[dependencies]
chronos-core = { path = "../../crates/chronos-core" }
chronos-dir = { path = "../../crates/chronos-dir" }
chronosd = { path = "../../crates/chronosd" }
tokio = { version = "1.37", features = ["macros", "net", "rt-multi-thread", "time"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
